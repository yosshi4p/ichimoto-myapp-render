
<!doctype html>
<html lang="ja">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>作品登録 | 400字小説集</title>

    <style>
        body {
            font-family: sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            line-height: 1.7;
        }

        h1 {
            margin-bottom: 10px;
        }

        .description {
            color: #666;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 18px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            margin-top: 5px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        textarea {
            height: 300px;
        }

        .required {
            color: #c0392b;
        }

        button {
            margin-top: 25px;
            padding: 12px 30px;
            font-size: 16px;
            background: #245b81;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #17415f;
        }

        .links {
            margin-top: 25px;
        }

        .error {
            color: #c0392b;
        }
    </style>
</head>

<body>

    <h1>400字小説 作品登録</h1>

    <p class="description">
        小説作品をPostgreSQLデータベースに登録します。
    </p>

    {% if error %}
    <p class="error">{{ error }}</p>
    {% endif %}

    <form method="POST">

        <label for="title">
            作品タイトル
            <span class="required">※必須</span>
        </label>
        <input
            type="text"
            id="title"
            name="title"
            maxlength="200"
            required
        >

        <label for="theme">テーマ</label>
        <input type="text" id="theme" name="theme">

        <label for="genre">ジャンル</label>
        <input type="text" id="genre" name="genre">

        <label for="protagonist">主人公</label>
        <input type="text" id="protagonist" name="protagonist">

        <label for="tone">文体・トーン</label>
        <input type="text" id="tone" name="tone">

        <label for="twist">どんでん返し・仕掛け</label>
        <input type="text" id="twist" name="twist">

        <label for="forbidden">入れないでほしい要素</label>
        <input type="text" id="forbidden" name="forbidden">

        <label for="content">
            小説本文
            <span class="required">※必須</span>
        </label>
        <textarea
            id="content"
            name="content"
            required
        ></textarea>

        <button type="submit">DBへ登録する</button>

    </form>

    <div class="links">
        <a href="/admin/list">登録済み作品一覧を見る</a>
        ｜
        <a href="/admin/logout">ログアウト</a>
    </div>

</body>
</html>
