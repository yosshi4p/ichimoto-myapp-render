<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>作品の削除確認 | 400字小説</title>
<style>
body{font-family:sans-serif;background:#f7f7f5;color:#333;margin:0}main{max-width:700px;margin:32px auto;padding:24px;background:white;border-radius:12px}.warning{color:#a00;font-weight:bold}.content{white-space:pre-wrap;line-height:1.8;padding:16px;background:#f7f7f5;border-radius:6px}.actions{display:flex;align-items:center;gap:20px;margin-top:24px}.actions form{margin:0}.delete-button{padding:12px 24px;color:white;background:#a00;border:1px solid #800;border-radius:5px;cursor:pointer}
</style>
<main>
<h1>作品を削除しますか？</h1>
<p class="warning">この操作は取り消せません。</p>
<p>作品ID：{{ story.id }}</p>
<h2>{{ story.title or '無題' }}</h2>
<p class="content">{{ story.content }}</p>
<div class="actions">
<form method="post" action="{{ url_for('delete_story', story_id=story.id) }}">
<input type="hidden" name="csrf_token" value="{{ csrf_token }}">
<button class="delete-button" type="submit">削除を実行</button>
</form>
<a href="{{ url_for('admin_list') }}">削除せず一覧に戻る</a>
</div>
</main>
</html>
