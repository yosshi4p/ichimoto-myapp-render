
<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>400字小説集 | 一本吉夫</title>

  <style>
    body {
      font-family: sans-serif;
      background: #f7f7f5;
      color: #333;
      margin: 0;
    }

    main {
      max-width: 760px;
      margin: 40px auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .intro {
      text-align: center;
      color: #777;
      margin-bottom: 40px;
    }

    .story {
      background: white;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 24px;
      margin: 20px 0;
    }

    .story h2 {
      margin-top: 0;
      font-size: 22px;
      color: #245b81;
    }

    .genre {
      color: #777;
      font-size: 14px;
      margin-bottom: 20px;
    }

    .content {
      white-space: pre-wrap;
      line-height: 1.9;
      overflow-wrap: anywhere;
    }

    .footer {
      text-align: center;
      color: #999;
      font-size: 13px;
      margin-top: 50px;
    }
  </style>
</head>

<body>

  <main>

    <h1>400字小説集</h1>

    <p class="intro">
      一本吉夫の短い物語たち。
    </p>

    {% for story in stories %}

      <article class="story">

        <!-- DBのtitle列を表示 -->
        <h2>{{ story.title or "無題" }}</h2>

        {% if story.genre %}
        <p class="genre">
          {{ story.genre }}
        </p>
        {% endif %}

        <!-- DBのcontent列を表示 -->
        <div class="content">{{ story.content }}</div>

      </article>

    {% else %}

      <p>まだ作品が登録されていません。</p>

    {% endfor %}

    <p class="footer">
      © 一本吉夫 400字小説集
    </p>

  </main>

</body>
</html>
