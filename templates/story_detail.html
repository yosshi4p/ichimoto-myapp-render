
<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>{{ story.title }} | 400字小説集</title>

  <style>
    body {
      font-family: sans-serif;
      background: #f7f7f5;
      color: #333;
      margin: 0;
      line-height: 1.9;
    }

    main {
      max-width: 760px;
      margin: 40px auto;
      padding: 20px;
    }

    article {
      background: white;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 30px;
    }

    h1 {
      font-size: 25px;
      margin-top: 0;
    }

    .content {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 17px;
    }

    .back {
      display: inline-block;
      margin-top: 30px;
      color: #2563eb;
      text-decoration: none;
    }
  </style>
</head>

<body>
  <main>
    <article>
      <h1>《{{ story.title }}》</h1>

      <div class="content">{{ story.content }}</div>
    </article>

    <a class="back"
       href="https://www.ichimoto-yoshio.com/">
      ← 作品一覧に戻る
    </a>
  </main>
</body>
</html>
