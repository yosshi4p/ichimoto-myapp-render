<!doctype html>
<html lang="ja">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>管理者ログイン</title>

    <style>
        body {
            font-family: sans-serif;
            max-width: 500px;
            margin: 80px auto;
            padding: 0 20px;
        }

        h1 {
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            font-size: 16px;
        }

        button {
            margin-top: 20px;
            padding: 12px 30px;
            font-size: 16px;
            cursor: pointer;
        }

        .error {
            color: red;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

    <h1>管理者ログイン</h1>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form method="POST">

        <label for="password">
            管理パスワード
        </label>

        <input
            type="password"
            id="password"
            name="password"
            required
        >

        <button type="submit">
            ログイン
        </button>

    </form>

</body>

</html>
