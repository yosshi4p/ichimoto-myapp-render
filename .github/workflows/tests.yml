name: Tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: publication_test
          POSTGRES_USER: publication_test
          POSTGRES_PASSWORD: publication_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U publication_test -d publication_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run all tests
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://publication_test:publication_test@localhost:5432/publication_test
        run: python -m unittest discover -v
